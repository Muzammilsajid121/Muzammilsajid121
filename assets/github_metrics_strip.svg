<svg width="100%" height="auto" viewBox="0 0 960 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&amp;family=Nunito:wght@800;900&amp;display=swap');
      .metric-num { font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 900; }
      .metric-lbl { font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 800; }
      .metric-sub { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; }
      .stat-card { filter: drop-shadow(3px 4px 0px #26241C); }
    </style>
  </defs>

  <!-- Metric 1: Downloads -->
  <g class="stat-card" transform="translate(10, 10)">
    <rect x="0" y="0" width="220" height="115" rx="14" fill="#FFFFFF" stroke="#26241C" stroke-width="2.5" />
    <rect x="14" y="-8" width="80" height="18" rx="4" fill="#E0705A" stroke="#26241C" stroke-width="1.2" transform="rotate(-2 50 0)" />
    <text x="24" y="5" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#FFFFFF">GOOGLE PLAY</text>
    <text x="18" y="48" class="metric-num" font-size="32" fill="#26241C">100K+</text>
    <text x="18" y="74" class="metric-lbl" font-size="14" fill="#4E6844">Organic Downloads</text>
    <text x="18" y="96" class="metric-sub" fill="#6B675A">Surah Yaseen Flagship</text>
  </g>

  <!-- Metric 2: Client Reviews -->
  <g class="stat-card" transform="translate(250, 10)">
    <rect x="0" y="0" width="220" height="115" rx="14" fill="#F7E8A8" stroke="#26241C" stroke-width="2.5" />
    <rect x="14" y="-8" width="76" height="18" rx="4" fill="#9DB68C" stroke="#26241C" stroke-width="1.2" transform="rotate(2 50 0)" />
    <text x="22" y="5" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#26241C">VERIFIED 5★</text>
    <text x="18" y="48" class="metric-num" font-size="32" fill="#26241C">20+ Orders</text>
    <text x="18" y="74" class="metric-lbl" font-size="14" fill="#26241C">Global Client Work</text>
    <text x="18" y="96" class="metric-sub" fill="#4E6844">15+ Fiverr 5.0★ Reviews</text>
  </g>

  <!-- Metric 3: Crash Free Rate -->
  <g class="stat-card" transform="translate(490, 10)">
    <rect x="0" y="0" width="220" height="115" rx="14" fill="#FFFFFF" stroke="#26241C" stroke-width="2.5" />
    <rect x="14" y="-8" width="70" height="18" rx="4" fill="#4E6844" stroke="#26241C" stroke-width="1.2" transform="rotate(-1.5 50 0)" />
    <text x="22" y="5" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#FFFFFF">STABILITY</text>
    <text x="18" y="48" class="metric-num" font-size="32" fill="#26241C">99.8%</text>
    <text x="18" y="74" class="metric-lbl" font-size="14" fill="#4E6844">Crash-Free Sessions</text>
    <text x="18" y="96" class="metric-sub" fill="#6B675A">600+ Android Devices</text>
  </g>

  <!-- Metric 4: AdMob eCPM Growth -->
  <g class="stat-card" transform="translate(730, 10)">
    <rect x="0" y="0" width="220" height="115" rx="14" fill="#FFFFFF" stroke="#26241C" stroke-width="2.5" />
    <rect x="14" y="-8" width="80" height="18" rx="4" fill="#E0705A" stroke="#26241C" stroke-width="1.2" transform="rotate(2 50 0)" />
    <text x="24" y="5" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#FFFFFF">MONETIZATION</text>
    <text x="18" y="48" class="metric-num" font-size="32" fill="#E0705A">3.5x</text>
    <text x="18" y="74" class="metric-lbl" font-size="14" fill="#26241C">eCPM Yield Uplift</text>
    <text x="18" y="96" class="metric-sub" fill="#6B675A">85%+ Show Rate Engine</text>
  </g>
</svg>
