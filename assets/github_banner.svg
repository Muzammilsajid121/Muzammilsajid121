<svg width="100%" height="auto" viewBox="0 0 980 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&amp;family=Nunito:wght@700;800;900&amp;display=swap');
      .font-title { font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; }
      .font-body { font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
      .font-mono { font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace; }
      .glow { filter: drop-shadow(0px 4px 12px rgba(224, 112, 90, 0.35)); }
      .wobble-card { filter: drop-shadow(4px 5px 0px #26241C); }
      .term-shadow { filter: drop-shadow(5px 6px 0px rgba(38, 36, 28, 0.85)); }
    </style>

    <!-- Linear Gradients -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F5EE" />
      <stop offset="100%" stop-color="#EFECE0" />
    </linearGradient>

    <linearGradient id="markerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9DB68C" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#86A873" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#23281F" />
      <stop offset="100%" stop-color="#1A1E17" />
    </linearGradient>
  </defs>

  <!-- Outer Border Frame with Neo-brutalist Shadow -->
  <rect x="10" y="10" width="960" height="380" rx="20" fill="#26241C" />
  <rect x="5" y="5" width="960" height="380" rx="20" fill="url(#paperGrad)" stroke="#26241C" stroke-width="3" />

  <!-- Grid Pattern Overlay for Architectural Feel -->
  <g opacity="0.07" stroke="#26241C" stroke-width="1">
    <line x1="5" y1="65" x2="965" y2="65" />
    <line x1="5" y1="125" x2="965" y2="125" />
    <line x1="5" y1="185" x2="965" y2="185" />
    <line x1="5" y1="245" x2="965" y2="245" />
    <line x1="5" y1="305" x2="965" y2="305" />
    <line x1="5" y1="365" x2="965" y2="365" />
    <line x1="85" y1="5" x2="85" y2="385" />
    <line x1="165" y1="5" x2="165" y2="385" />
    <line x1="245" y1="5" x2="245" y2="385" />
    <line x1="325" y1="5" x2="325" y2="385" />
    <line x1="405" y1="5" x2="405" y2="385" />
    <line x1="485" y1="5" x2="485" y2="385" />
  </g>

  <!-- Washi Tape Accents (Top Left & Top Right) -->
  <g transform="rotate(-3 80 15)">
    <rect x="45" y="10" width="110" height="24" rx="2" fill="#E0705A" fill-opacity="0.65" stroke="#26241C" stroke-width="1.2" />
  </g>
  <g transform="rotate(3 890 20)">
    <rect x="830" y="12" width="105" height="22" rx="2" fill="#9DB68C" fill-opacity="0.6" stroke="#26241C" stroke-width="1.2" />
  </g>

  <!-- Left Column: Branding, Eyebrow & Hero Copy -->
  <g transform="translate(45, 45)">

    <!-- Eyebrow Pill -->
    <g class="wobble-card" transform="translate(0, 0)">
      <rect x="0" y="0" width="375" height="32" rx="16" fill="#9DB68C" stroke="#26241C" stroke-width="2" />
      <circle cx="16" cy="16" r="4.5" fill="#4E6844" />
      <text x="30" y="21" class="font-mono" font-size="11.5" font-weight="700" fill="#26241C" letter-spacing="0.5">100K+ DOWNLOADS · 20+ CLIENT DELIVERIES</text>
    </g>

    <!-- Main Heading -->
    <g transform="translate(0, 72)">
      <text x="0" y="0" class="font-title" font-size="37" fill="#26241C" letter-spacing="-0.5">I build Flutter apps that</text>
      
      <!-- Marker Highlight for "make it to production" -->
      <g transform="translate(0, 14)">
        <rect x="0" y="3" width="395" height="42" rx="6" fill="url(#markerGrad)" stroke="#26241C" stroke-width="2" />
        <text x="14" y="32" class="font-title" font-size="35" fill="#26241C" letter-spacing="-0.5">make it to production.</text>
      </g>
    </g>

    <!-- Subtitle / Bio -->
    <text x="0" y="162" class="font-body" font-size="16" fill="#6B675A" width="440">
      <tspan x="0" dy="0">Hi, I'm </tspan>
      <tspan font-weight="900" fill="#26241C">Muzammil Sajid</tspan>
      <tspan> — Mobile App Engineer &amp; Publisher</tspan>
      <tspan x="0" dy="24">under </tspan>
      <tspan font-weight="800" fill="#4E6844">"Code To Flutter"</tspan>
      <tspan> on Google Play. CS Graduate (2025).</tspan>
      <tspan x="0" dy="24">Specialist in Clean Architecture, AdMob &amp; ARCore.</tspan>
    </text>

    <!-- Neo-Brutalist Badges Row -->
    <g transform="translate(0, 245)">
      <!-- Badge 1: Play Store Flagship -->
      <g class="wobble-card">
        <rect x="0" y="0" width="140" height="34" rx="8" fill="#FFFFFF" stroke="#26241C" stroke-width="2" />
        <rect x="6" y="6" width="22" height="22" rx="5" fill="#4E6844" />
        <text x="12" y="21" class="font-mono" font-size="12" fill="#FFFFFF" font-weight="700">▶</text>
        <text x="35" y="22" class="font-body" font-size="13" font-weight="800" fill="#26241C">100K+ Installs</text>
      </g>

      <!-- Badge 2: 5.0 Rating -->
      <g class="wobble-card" transform="translate(152, 0)">
        <rect x="0" y="0" width="135" height="34" rx="8" fill="#F7E8A8" stroke="#26241C" stroke-width="2" />
        <text x="12" y="22" class="font-title" font-size="13.5" font-weight="900" fill="#26241C">★ 5.0 Verified</text>
      </g>

      <!-- Badge 3: Open Source -->
      <g class="wobble-card" transform="translate(298, 0)">
        <rect x="0" y="0" width="140" height="34" rx="8" fill="#FFFFFF" stroke="#26241C" stroke-width="2" />
        <text x="14" y="22" class="font-body" font-size="13" font-weight="800" fill="#26241C">⚡ ARCore Author</text>
      </g>
    </g>
  </g>

  <!-- Right Column: Interactive Styled Neo-Terminal Mockup -->
  <g transform="translate(530, 42)">
    <g class="term-shadow">
      <!-- Terminal Outer Box -->
      <rect x="0" y="0" width="405" height="310" rx="16" fill="url(#termGrad)" stroke="#26241C" stroke-width="2.5" />

      <!-- Terminal Title Bar -->
      <rect x="0" y="0" width="405" height="38" rx="16" fill="#1C2018" />
      <rect x="0" y="22" width="405" height="16" fill="#1C2018" />
      <line x1="0" y1="38" x2="405" y2="38" stroke="#384032" stroke-width="1.5" />

      <!-- Window Control Dots -->
      <circle cx="20" cy="19" r="6" fill="#E0705A" stroke="#26241C" stroke-width="1" />
      <circle cx="38" cy="19" r="6" fill="#E8C35A" stroke="#26241C" stroke-width="1" />
      <circle cx="56" cy="19" r="6" fill="#9DB68C" stroke="#26241C" stroke-width="1" />

      <!-- Terminal Tab Title -->
      <text x="202" y="24" class="font-mono" font-size="12" fill="#9DB68C" font-weight="700" text-anchor="middle">muzammil@dev:~</text>

      <!-- Terminal Body Content -->
      <g transform="translate(18, 62)">
        <!-- Command 1 -->
        <text x="0" y="0" class="font-mono" font-size="12.5" fill="#9DB68C" font-weight="700">
          <tspan fill="#7FD98A">$</tspan> flutter --version
        </text>
        <text x="0" y="18" class="font-mono" font-size="11.5" fill="#D9E8CF" opacity="0.9">
          • Flutter 3.x • Dart 3.x (Clean Arch / BLoC)
        </text>

        <!-- Command 2 -->
        <text x="0" y="46" class="font-mono" font-size="12.5" fill="#9DB68C" font-weight="700">
          <tspan fill="#7FD98A">$</tspan> cat production_milestones.json
        </text>
        
        <!-- JSON Display -->
        <g transform="translate(6, 64)" font-size="11" class="font-mono">
          <text x="0" y="0" fill="#E8C35A">{</text>
          <text x="12" y="16" fill="#D9E8CF">"flagship": <tspan fill="#7FD98A">"Surah Yaseen (100K+ dl)"</tspan>,</text>
          <text x="12" y="32" fill="#D9E8CF">"crash_free": <tspan fill="#7FD98A">"99.8% across 600+ devices"</tspan>,</text>
          <text x="12" y="48" fill="#D9E8CF">"admob_ecpm": <tspan fill="#7FD98A">"+350% (38% → 85%+ show)"</tspan>,</text>
          <text x="12" y="64" fill="#D9E8CF">"client_satisfaction": <tspan fill="#E8C35A">"5.0★ (Fiverr &amp; Global)"</tspan>,</text>
          <text x="12" y="80" fill="#D9E8CF">"open_source": <tspan fill="#7FD98A">"arcore_flutter_plus"</tspan></text>
          <text x="0" y="96" fill="#E8C35A">}</text>
        </g>

        <!-- Active Prompt with cursor -->
        <g transform="translate(0, 192)">
          <text x="0" y="0" class="font-mono" font-size="12.5" fill="#9DB68C" font-weight="700">
            <tspan fill="#7FD98A">$</tspan> contact --hire
          </text>
          <text x="135" y="0" class="font-mono" font-size="12.5" fill="#7FD98A">ready_to_build ■</text>
        </g>
      </g>

      <!-- Terminal Bottom Bar / Chips -->
      <g transform="translate(0, 274)">
        <rect x="0" y="0" width="405" height="36" rx="0" fill="#141711" />
        <rect x="0" y="20" width="405" height="16" rx="16" fill="#141711" />
        <line x1="0" y1="0" x2="405" y2="0" stroke="#384032" stroke-width="1" />

        <text x="18" y="22" class="font-mono" font-size="10.5" fill="#6B675A">STACK:</text>

        <!-- Mini Tags inside terminal footer -->
        <rect x="68" y="8" width="56" height="19" rx="4" fill="#2B3226" stroke="#45503D" stroke-width="1" />
        <text x="74" y="22" class="font-mono" font-size="10" fill="#7FD98A">Flutter</text>

        <rect x="130" y="8" width="44" height="19" rx="4" fill="#2B3226" stroke="#45503D" stroke-width="1" />
        <text x="136" y="22" class="font-mono" font-size="10" fill="#7FD98A">BLoC</text>

        <rect x="180" y="8" width="46" height="19" rx="4" fill="#2B3226" stroke="#45503D" stroke-width="1" />
        <text x="186" y="22" class="font-mono" font-size="10" fill="#7FD98A">AdMob</text>

        <rect x="232" y="8" width="56" height="19" rx="4" fill="#2B3226" stroke="#45503D" stroke-width="1" />
        <text x="238" y="22" class="font-mono" font-size="10" fill="#7FD98A">ARCore</text>

        <rect x="294" y="8" width="48" height="19" rx="4" fill="#2B3226" stroke="#45503D" stroke-width="1" />
        <text x="300" y="22" class="font-mono" font-size="10" fill="#7FD98A">Kotlin</text>
      </g>
    </g>
  </g>
</svg>
